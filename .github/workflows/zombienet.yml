# Manually runs the zombienet-sdk bridge integration tests (gated behind the `zombie-ci` feature).
name: Zombienet Tests

on:
  workflow_dispatch:
  # Also run on pull requests, so the suite validates a branch pushed to THIS repo (e.g. a
  # maintainer mirror of a fork PR) without the workflow needing to be on the default branch.
  # NOTE: for PRs from a fork GitHub runs the base branch's workflows, so this only triggers for
  # same-repo branches/PRs.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exposes config (`.github/env` + the polkadot-sdk revision from `Cargo.lock`) as outputs, since
  # the `env` context isn't available in `container.image`.
  set-variables:
    runs-on: ubuntu-latest
    outputs:
      CI_IMAGE: ${{ steps.vars.outputs.IMAGE }}
      IMAGE_REGISTRY: ${{ steps.vars.outputs.IMAGE_REGISTRY }}
      ZOMBIE_PROVIDER: ${{ steps.vars.outputs.ZOMBIE_PROVIDER }}
      FELLOWS_RUNTIMES_TAG: ${{ steps.vars.outputs.FELLOWS_RUNTIMES_TAG }}
      POLKADOT_SDK_HASH: ${{ steps.vars.outputs.POLKADOT_SDK_HASH }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          cat .github/env >> "$GITHUB_OUTPUT"
          # Shared with scripts/generate-codegen.sh so the node images and the committed codegen track
          # the same pinned polkadot-sdk revision.
          REV="$(scripts/polkadot-sdk-rev.sh)"
          # The paritypr `*-debug` images built from polkadot-sdk master are tagged
          # `master-<short-8-char-commit>` (see the `master-` prefix on the image refs below).
          echo "POLKADOT_SDK_HASH=${REV:0:8}" >> "$GITHUB_OUTPUT"
          echo "Using polkadot-sdk revision: ${REV:0:8} (full: $REV)"

  # Pre-flight (Python-only, no build): fail fast if the zombienet and relay-clients codegens have
  # drifted into SCALE-incompatible bridge types, before the ~30min build + test below.
  check-codegen-compat:
    name: Check codegen compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Check codegen compatibility
        run: python3 scripts/check-codegen-compat.py --verbose

  # Builds `substrate-relay` and uploads it as an artifact for the test job.
  build-relay:
    name: Build substrate-relay
    runs-on: parity-large
    needs: [set-variables, check-codegen-compat]
    container:
      image: ${{ needs.set-variables.outputs.CI_IMAGE }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          cache-on-failure: true
          cache-all-crates: true

      - name: Build substrate-relay
        run: |
          cargo fetch
          CARGO_NET_OFFLINE=true SKIP_WASM_BUILD=1 cargo build --release -p substrate-relay --features static-ssl
          mkdir -p ./artifacts
          mv -v ./target/release/substrate-relay ./artifacts/

      - name: Upload substrate-relay
        uses: actions/upload-artifact@v4
        with:
          name: substrate-relay
          path: ./artifacts
          retention-days: 2

  # Compiles the zombienet integration test binary once (without running it) and uploads it, so each
  # matrix leg in `run-tests` only downloads and runs it instead of recompiling the crate per test.
  # Built on the same bare `parity-large` runner the tests run on so the binary's dynamic libs match.
  build-tests:
    name: Build zombienet test binary
    runs-on: parity-large
    needs: [check-codegen-compat]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      # Toolchain must match the ci-unified image used elsewhere (Rust 1.88.0).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          cache-on-failure: true
          cache-all-crates: true
          workspaces: ". -> target"

      - name: Build test binary
        run: |
          # Compile the `zombie-ci` test binary without running it, then stash the freshly built
          # binary (cargo names the `bridges` test target target/debug/deps/bridges-<hash>; take the
          # newest, excluding the .d depfile) for the matrix legs.
          cargo test -p bridges-zombienet-sdk-tests --features zombie-ci --no-run
          bin="$(ls -t target/debug/deps/bridges-* | grep -v '\.d$')"
          mkdir -p ./artifacts
          cp "${bin%%$'\n'*}" ./artifacts/bridges-zombienet-tests

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: zombienet-test-binary
          path: ./artifacts
          retention-days: 2

  # Builds the fellows `chain-spec-generator` for the native-only Kusama <> Polkadot leg. The
  # Polkadot/Kusama runtimes live in polkadot-fellows/runtimes (not polkadot-sdk), so this checks out
  # that repo at the release whose runtimes match the committed `tests/codegen/*.rs` and builds one
  # binary embedding all six runtimes (built with `fast-runtime` for short CI sessions). The single
  # binary is uploaded under both `-polkadot` / `-kusama` names the `kusama_polkadot` environment
  # expects (see `bins()` in tests/kusama_polkadot/environment.rs).
  build-chain-spec-generator:
    name: Build fellows chain-spec-generator
    runs-on: parity-large
    needs: [set-variables, check-codegen-compat]
    container:
      image: ${{ needs.set-variables.outputs.CI_IMAGE }}
    steps:
      - name: Checkout fellows runtimes
        # Fellows release the committed Kusama <> Polkadot codegen was generated from (from
        # `.github/env`). Bump it (and regenerate the codegen — see
        # testing/zombienet-sdk-tests/README.md) together.
        uses: actions/checkout@v4
        with:
          repository: polkadot-fellows/runtimes
          ref: ${{ needs.set-variables.outputs.FELLOWS_RUNTIMES_TAG }}
          path: fellows-runtimes

      - name: Rust Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: fellows-runtimes -> target
          cache-on-failure: true
          cache-all-crates: true

      - name: Build chain-spec-generator
        working-directory: fellows-runtimes
        run: |
          # One binary supports all the `-local` chain specs the K<>P environment spawns.
          cargo build --release -p chain-spec-generator --no-default-features \
            --features fast-runtime,polkadot,kusama,asset-hub-polkadot,asset-hub-kusama,bridge-hub-polkadot,bridge-hub-kusama
          mkdir -p ../artifacts
          cp -v target/release/chain-spec-generator ../artifacts/chain-spec-generator-polkadot
          cp -v target/release/chain-spec-generator ../artifacts/chain-spec-generator-kusama

      - name: Upload chain-spec-generator
        uses: actions/upload-artifact@v4
        with:
          name: chain-spec-generator
          path: ./artifacts
          retention-days: 2

  # Runs on a Docker-capable runner (no container) so the docker provider can use the host Docker
  # daemon and reach the spawned nodes on 127.0.0.1.
  run-tests:
    name: Run zombienet tests (${{ matrix.test }})
    runs-on: parity-large
    needs: [set-variables, build-relay, build-tests, build-chain-spec-generator]
    timeout-minutes: 90
    strategy:
      # One leg per test, each on its own runner: a test spawns full relay+parachain networks, too
      # heavy to run several concurrently on one runner. Legs run the prebuilt binary from
      # `build-tests`. fail-fast: false so one failure doesn't cancel the rest. Add an entry per test.
      #
      # `provider` selects how nodes are spawned: Rococo <> Westend runs from the polkadot-sdk
      # `*-debug` docker images; Kusama <> Polkadot is native-only (fellows chain-spec-generator +
      # extracted polkadot/polkadot-parachain binaries), see tests/kusama_polkadot/environment.rs.
      fail-fast: false
      matrix:
        include:
          - test: rococo_westend::asset_transfer
            provider: docker
          - test: rococo_westend::free_headers
            provider: docker
          - test: kusama_polkadot::asset_transfer
            provider: native
    env:
      ZOMBIE_PROVIDER: ${{ matrix.provider }}
      POLKADOT_IMAGE: ${{ needs.set-variables.outputs.IMAGE_REGISTRY }}/polkadot-debug:master-${{ needs.set-variables.outputs.POLKADOT_SDK_HASH }}
      CUMULUS_IMAGE: ${{ needs.set-variables.outputs.IMAGE_REGISTRY }}/polkadot-parachain-debug:master-${{ needs.set-variables.outputs.POLKADOT_SDK_HASH }}
    steps:
      - name: Download substrate-relay
        uses: actions/download-artifact@v4
        with:
          name: substrate-relay
          path: ./bin

      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: zombienet-test-binary
          path: ./bin

      - name: Point the tests at the relay binary
        run: |
          chmod +x "$GITHUB_WORKSPACE/bin/substrate-relay"
          echo "SUBSTRATE_RELAY_BINARY=$GITHUB_WORKSPACE/bin/substrate-relay" >> "$GITHUB_ENV"

      # The paritypr `*-debug` images are public on Docker Hub, so no registry auth is needed.
      - name: Pre-pull node images
        run: |
          echo "POLKADOT_IMAGE=$POLKADOT_IMAGE"
          echo "CUMULUS_IMAGE=$CUMULUS_IMAGE"
          docker pull "$POLKADOT_IMAGE"
          docker pull "$CUMULUS_IMAGE"

      # Native-only Kusama <> Polkadot leg: the test spawns nodes with the native provider, so it
      # needs the `polkadot` / `polkadot-parachain` binaries (+ PVF workers) on disk plus the fellows
      # `chain-spec-generator`. We reuse the already-pulled `*-debug` images as the source of the
      # pinned-revision node binaries (no separate polkadot-sdk build) and take the chain-spec
      # generators from the `build-chain-spec-generator` artifact.
      - name: Download chain-spec-generator
        if: matrix.provider == 'native'
        uses: actions/download-artifact@v4
        with:
          name: chain-spec-generator
          path: ./native-bin

      - name: Provision native binaries
        if: matrix.provider == 'native'
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/native-bin"
          mkdir -p "$BIN"
          # Copy a binary out of an image (co-locating polkadot's PVF workers with it, as a validator
          # spawns them as child processes and won't start otherwise). `command -v` locates each on
          # the image's PATH so we don't hardcode an install prefix.
          extract() {
            local img="$1"; shift
            local cid; cid="$(docker create "$img")"
            for b in "$@"; do
              local src; src="$(docker run --rm --entrypoint sh "$img" -c "command -v $b")"
              docker cp "$cid:$src" "$BIN/$b"
            done
            docker rm -f "$cid" >/dev/null
          }
          extract "$POLKADOT_IMAGE" polkadot polkadot-prepare-worker polkadot-execute-worker
          extract "$CUMULUS_IMAGE" polkadot-parachain
          chmod +x "$BIN"/*
          {
            echo "POLKADOT_BINARY=$BIN/polkadot"
            echo "POLKADOT_PARACHAIN_BINARY=$BIN/polkadot-parachain"
            echo "CHAIN_SPEC_GEN_BINARY_FOR_POLKADOT=$BIN/chain-spec-generator-polkadot"
            echo "CHAIN_SPEC_GEN_BINARY_FOR_KUSAMA=$BIN/chain-spec-generator-kusama"
          } >> "$GITHUB_ENV"
          ls -l "$BIN"

      # Run the prebuilt binary with the test-name filter (same args as `cargo test -- ...`).
      - name: Run zombienet test
        run: |
          chmod +x "$GITHUB_WORKSPACE/bin/bridges-zombienet-tests"
          "$GITHUB_WORKSPACE/bin/bridges-zombienet-tests" ${{ matrix.test }} --nocapture --test-threads=1

      # On failure, collect the zombienet per-node logs (under /tmp/zombie-*) so node panics/stalls
      # are diagnosable from the run without a local repro. One artifact per matrix leg.
      - name: Upload zombienet node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zombienet-logs-${{ strategy.job-index }}
          path: /tmp/zombie-*/**/*.log
          retention-days: 3
          if-no-files-found: warn
